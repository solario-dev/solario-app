services:
  mongo:
    image: mongo:7
    container_name: solario-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: SolarioDb
    volumes:
      - mongo-data:/data/db

  postgres:
    image: postgres:16
    container_name: solario-postgres
    environment:
      POSTGRES_DB: solario
      POSTGRES_USER: solario
      POSTGRES_PASSWORD: solario
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend/src/Solario
      dockerfile: Dockerfile
    container_name: solario-backend
    ports:
      - "5001:5000"
    environment:
      - MONGODB_CONNECTION_STRING=mongodb://mongo:27017
      - MONGODB_DATABASE=SolarioDb
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=solario;Username=solario;Password=solario
      - ASPNETCORE_ENVIRONMENT=Development
      - JWT_KEY=RESET_TOKENOW_WYMUSZENIE_WYLOGOWANIA_V2_!!!
      - JWT_ISSUER=solario
      - JWT_AUDIENCE=solario_frontend
    depends_on:
      - mongo
      - postgres

volumes:
  mongo-data:
  postgres-data: